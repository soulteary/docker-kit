name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]


jobs:
  # Code formatting check
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Check code formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files have incorrect formatting:"
            gofmt -s -d .
            exit 1
          fi

  # Code static analysis
  vet:
    name: Code Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run go vet
        run: go vet ./...

  # Code testing
  #
  # The matrix is the oldest supported Go -- keep it in step with the `go`
  # directive in go.mod -- and the current release, on both supported systems.
  test:
    name: Code Testing (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go: [ '1.27.0', 'stable' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display coverage summary
        run: go tool cover -func=coverage.out

      # One combination produces the browsable report; the artifact name has to
      # stay unique across the matrix.
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.html

  # Code quality check (using golangci-lint)
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          only-new-issues: false

  # Dependency security scan
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run security scan
        run: govulncheck ./...
